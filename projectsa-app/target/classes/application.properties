# ProjectSA – local demo (CLAUDE.md §3)
spring.application.name=projectsa

# H2 file database in SQL Server compatibility mode; data survives restarts (delete ./data to reset)
spring.datasource.url=jdbc:h2:file:./data/projectsa;MODE=MSSQLServer;DATABASE_TO_UPPER=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=
# schema + seed come from Project Source/ProjectSA_SQL.sql via DatabaseInitializer, not Spring's sql.init
spring.sql.init.mode=never

# H2 console for the demo: http://localhost:8080/h2-console  (JDBC URL above, user sa, empty password)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# uploads (UC02 Solution PDFs, UC06 attachments, F3 profile pictures)
app.upload-dir=./uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB

server.servlet.session.timeout=8h

# the browser re-checks pages / JS / CSS on every load, so UI changes show after a restart without Ctrl+F5
spring.web.resources.cache.cachecontrol.no-cache=true

# every design query is logged with its id, e.g. "Query UC04 8.1"
logging.level.com.projectsa.common.Sql=DEBUG

# demo accounts sale / presale / pm / tech1 / tech2, password demo1234 (created on first start)
app.demo-users=true
